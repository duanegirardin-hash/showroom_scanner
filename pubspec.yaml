name: showroom_scanner
description: Showroom scanner app for quotes and barcode scanning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.6.0
  csv: ^6.0.0
  file_picker: ^8.3.7
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data/
    - assets/data/customers.csv
    - assets/sounds/
    - assets/sounds/good_scan2.mp3
